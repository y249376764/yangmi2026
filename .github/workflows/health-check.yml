name: 源仓库健康巡检

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0点 = 北京时间早8点
  workflow_dispatch:       # 支持手动触发
  push:
    paths:
      - "tvbox.json"
      - "tvbox_2.json"
      - "tvbox_py.json"
      - "tingshu.json"
      - "tingshu_2.json"
      - "music.json"
      - "live.json"
      - "short.json"
      - "js/**"
      - "py/**"

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行健康巡检
        run: |
          python health_check.py || true

      - name: 上传健康报告(artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: HEALTH_REPORT.md

      - name: 提交健康报告到仓库
        run: |
          if [ -f HEALTH_REPORT.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add HEALTH_REPORT.md
            git commit -m "🤖 自动更新健康巡检报告 $(date -u +%Y-%m-%d)" || echo "无变化跳过"
            git push
          fi
