<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分类导航</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:transparent;color:#fff;font-family:system-ui,-apple-system,sans-serif}
  html:not(.fm-native) body{background:#14161a}
  .wrap{padding:calc(max(var(--fm-safe-top,0px),env(safe-area-inset-top,0px)) + 14px) 14px 40px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{font-size:12px;opacity:.6;margin-bottom:14px}
  .search{display:flex;gap:8px;margin-bottom:14px}
  .search input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
                background:rgba(255,255,255,.08);color:#fff;font-size:14px}
  .search button{padding:10px 16px;border-radius:10px;border:0;background:#2E9465;color:#fff;font-size:14px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
       background:rgba(255,255,255,.07);color:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
  .tab.on{background:#2E9465;border-color:#2E9465}
  .sitelist{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .site{padding:11px 13px;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;
        display:flex;justify-content:space-between;align-items:center;gap:8px}
  .site .nm{font-size:14px}
  .site .g{font-size:11px;opacity:.6;flex:0 0 auto}
  .msg{padding:24px 12px;text-align:center;opacity:.7;font-size:13px;line-height:1.6}
  .tip{margin-top:16px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.06);
       font-size:11px;opacity:.65;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>📂 分类导航</h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="search">
    <input id="kw" placeholder="搜全网（走 App 原生聚合搜索）">
    <button id="go">搜索</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="sitelist" id="sites"></div>
  <div class="msg" id="msg"></div>
  <div class="tip" id="tip"></div>
</div>
<script>
var MANIFEST='./sites_manifest.json';
var state={group:'',sites:[],groups:[],fm:null};

function $(id){return document.getElementById(id);}
function ready(cb){
  if(window.fm){state.fm=window.fm;cb(window.fm);}
  else window.addEventListener('fmsdk',function(){state.fm=window.fm;cb(window.fm);});
}

function renderTabs(){
  var all=['全部'].concat(state.groups);
  if(!state.group) state.group='全部';
  $('tabs').innerHTML=all.map(function(g){
    var n = g==='全部' ? state.sites.length : state.sites.filter(function(s){return s.group===g;}).length;
    return '<button class="tab'+(g===state.group?' on':'')+'" data-g="'+g+'">'+g+' '+n+'</button>';
  }).join('');
  [].forEach.call($('tabs').children,function(b){
    b.onclick=function(){state.group=b.dataset.g;renderTabs();renderSites();};
  });
}

function renderSites(){
  var list = state.group==='全部' ? state.sites : state.sites.filter(function(s){return s.group===state.group;});
  $('sites').innerHTML=list.map(function(s){
    return '<div class="site" data-key="'+s.key+'"><span class="nm">'+s.name+'</span><span class="g">'+s.group+'</span></div>';
  }).join('');
  [].forEach.call($('sites').children,function(el){
    el.onclick=function(){openSite(el.dataset.key);};
  });
  $('msg').textContent = list.length ? '' : '该分类暂无站点';
}

/* ★ 核心：进入站点
   fm SDK 没有"切换到指定站点"的方法（fm.site() 只读当前站点）。
   可用的是 fm.openSite() —— 打开 App 原生「内容源选择器」，用户在弹窗里选。
   这里逐级降级：openSite(key) → openSite() → openVod() → 提示手动切。 */
function openSite(key){
  var fm=state.fm;
  if(!fm){ $('msg').textContent='SDK 未就绪'; return; }
  var site=null;
  state.sites.forEach(function(s){ if(s.key===key) site=s; });
  var name=site?site.name:key;
  $('msg').textContent='正在打开「'+name+'」…';
  var done=false;
  function fallback(){
    if(done) return;
    if(typeof fm.openSite==='function'){
      try{ var r2=fm.openSite(); if(r2&&r2.then){ r2.then(function(){done=true;$('msg').textContent='已在原生选择器中选择站点';}).catch(function(){last();}); return; } done=true; $('msg').textContent='已打开内容源选择器'; return; }catch(e){}
    }
    last();
  }
  function last(){
    if(done) return;
    if(typeof fm.openVod==='function'){ try{ fm.openVod(); done=true; $('msg').textContent='已回到原生点播首页，请在站点列表选择「'+name+'」'; return; }catch(e){} }
    $('msg').textContent='请在 App 原生站点列表里选择「'+name+'」（SDK 不支持直接切换站点）';
  }
  try{
    if(typeof fm.openSite==='function'){
      var r=fm.openSite(key);
      if(r&&r.then){ r.then(function(){done=true;$('msg').textContent='已打开「'+name+'」';}).catch(fallback); }
      else { done=true; $('msg').textContent='已打开「'+name+'」'; }
      return;
    }
  }catch(e){}
  fallback();
}

function doSearch(){
  var kw=($('kw').value||'').trim();
  if(!kw){ $('msg').textContent='请输入关键词'; return; }
  if(!state.fm){ $('msg').textContent='SDK 未就绪'; return; }
  try{ state.fm.search(kw,{direct:true}); $('msg').textContent='已发起搜索：'+kw; }
  catch(e){ $('msg').textContent='搜索失败：'+e; }
}

$('go').onclick=doSearch;
$('kw').addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch(); });

function boot(fm){
  fm.req(MANIFEST).then(function(r){
    var m;
    try{ m=JSON.parse(r.body); }catch(e){ $('sub').textContent='清单解析失败'; $('msg').textContent='确认 sites_manifest.json 与本页面同目录'; return; }
    state.sites=m.sites||[];
    state.groups=m.groups||[];
    $('sub').textContent='共 '+state.sites.length+' 个 Python 蜘蛛站点 · '+state.groups.length+' 个分类';
    renderTabs(); renderSites();
    if(state.fm&&typeof state.fm.history==='function'){
      state.fm.history().then(function(h){
        if(h&&h.length) $('tip').textContent='最近观看 '+h.length+' 条 · 点站点后若直接进站点失败，会降级打开原生内容源选择器';
      }).catch(function(){});
    }
    $('tip').textContent=$('tip').textContent||'点站点 → 打开 App 原生内容源选择器；搜索走 App 聚合搜索';
  }).catch(function(e){
    $('sub').textContent='清单加载失败';
    $('msg').textContent=String(e)+'（确认 sites_manifest.json 与本页面同目录）';
  });
}
if(window.fm){state.fm=window.fm;boot(window.fm);} else window.addEventListener('fmsdk',function(){state.fm=window.fm;boot(window.fm);});
</script>
</body>
</html>
