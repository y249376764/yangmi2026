<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分类导航</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:#fff;font-family:system-ui,sans-serif}
  .wrap{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 32px}
  h1{font-size:20px;margin:0 0 14px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;z-index:5;
       padding:8px 0;background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}
  .tab{padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
       background:rgba(255,255,255,.08);color:#fff;font-size:14px;cursor:pointer}
  .tab.on{background:#2E9465;border-color:#2E9465}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .card{border-radius:10px;overflow:hidden;background:rgba(255,255,255,.08);cursor:pointer}
  .pic{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222;display:block}
  .ttl{font-size:12px;padding:6px;line-height:1.3;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sitelist{display:flex;flex-direction:column;gap:8px}
  .site{padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;
        display:flex;justify-content:space-between;align-items:center}
  .site .g{font-size:12px;opacity:.65}
  .msg{padding:20px;text-align:center;opacity:.7;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📂 分类导航</h1>
  <div class="tabs" id="tabs"></div>
  <div class="sitelist" id="sites"></div>
  <div id="list" style="margin-top:16px"></div>
  <div class="msg" id="msg">加载中…</div>
</div>
<script>
var MANIFEST = './sites_manifest.json';
var state = { group: '', sites: [], current: null };

function ready(cb){ if(window.fm) cb(window.fm); else window.addEventListener('fm:ready', function(){ cb(window.fm); }); }
function $(id){ return document.getElementById(id); }

function renderTabs(groups){
  var all = ['全部'].concat(groups);
  if(!state.group) state.group = '全部';
  $('tabs').innerHTML = all.map(function(g){
    return '<button class="tab'+(g===state.group?' on':'')+'" data-g="'+g+'">'+g+'</button>';
  }).join('');
  [].forEach.call($('tabs').children, function(b){
    b.onclick = function(){ state.group = b.dataset.g; state.current = null; $('list').innerHTML=''; renderTabs(groups); renderSites(); };
  });
}

function renderSites(){
  var list = state.group==='全部' ? state.sites : state.sites.filter(function(s){ return (s.group||'未分组')===state.group; });
  $('sites').innerHTML = list.map(function(s){
    return '<div class="site" data-key="'+s.key+'"><span>'+s.name+'</span><span class="g">'+(s.group||'未分组')+'</span></div>';
  }).join('');
  [].forEach.call($('sites').children, function(el){
    el.onclick = function(){
      var s = null;
      state.sites.forEach(function(x){ if(x.key===el.dataset.key) s=x; });
      if(s) openSite(s);
    };
  });
  $('msg').textContent = list.length ? '点站点查看内容' : '该分组暂无站点';
}

// 拉首页内容：type 0/1 走 CMS 接口，type 3 走自己的 spider（交给原生）
function openSite(s){
  state.current = s;
  $('msg').textContent = '加载 '+s.name+' …';
  $('list').innerHTML = '';
  if(s.type===3){ $('msg').textContent = s.name+' 是 Spider 站点，请用 App 原生首页查看（SDK 不提供切站点）'; return; }
  var url = s.api.replace(/\/$/,'') + '/?ac=vodlist&pg=1';
  ready(function(fm){
    fm.req(url).then(function(r){
      if(!r || !r.ok){ $('msg').textContent = '请求失败：'+((r&&r.error)||'未知'); return; }
      var data;
      try{ data = JSON.parse(r.body); }catch(e){ $('msg').textContent='返回不是 JSON'; return; }
      var arr = (data && data.list) || [];
      if(!arr.length){ $('msg').textContent='没有内容'; return; }
      $('msg').textContent = '';
      $('list').innerHTML = '<div class="grid">' + arr.map(function(v){
        return '<div class="card" data-id="'+v.vod_id+'" data-pic="'+(v.vod_pic||'')+'" data-name="'+(v.vod_name||'')+'">'+
               '<img class="pic" src="'+ (window.fm ? '' : '') +'" data-src="'+(v.vod_pic||'')+'">'+
               '<div class="ttl">'+(v.vod_name||'')+'</div></div>';
      }).join('') + '</div>';
      // 图片走 fm.res 避免 CORS/防盗链
      [].forEach.call($('list').querySelectorAll('img'), function(img){
        var src = img.dataset.src;
        if(!src){ img.style.display='none'; return; }
        if(window.fm && window.fm.res){
          window.fm.res(src).then(function(u){ if(u) img.src = u; }).catch(function(){ img.src = src; });
        } else { img.src = src; }
      });
      [].forEach.call($('list').querySelectorAll('.card'), function(c){
        c.onclick = function(){
          window.fm.vod(s.key, c.dataset.id, c.dataset.name, c.dataset.pic);
        };
      });
    }).catch(function(e){ $('msg').textContent = '请求异常：'+e; });
  });
}

function boot(){
  ready(function(fm){
    fm.req(MANIFEST).then(function(r){
      var m;
      try{ m = JSON.parse(r.body); }catch(e){ $('msg').textContent='清单解析失败'; return; }
      state.sites = m.sites || [];
      renderTabs(m.groups || ['影视','小说','音频']);
      renderSites();
    }).catch(function(e){
      $('msg').textContent = '清单加载失败：'+e+'（确认 sites_manifest.json 与本页面同目录）';
    });
  });
}
if(window.fm) boot(); else window.addEventListener('fm:ready', boot);
</script>
</body>
</html>
